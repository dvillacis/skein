site_name: skein
site_description: Weighted structured nonconvex sparse models — Rust core, Python API
site_url: https://dvillacis.github.io/skein/
repo_name: dvillacis/skein
repo_url: https://github.com/dvillacis/skein
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tilde

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            # Show the parent class so users see the inheritance chain
            # (e.g. MCPPathRegressor → _PathRegressorBase → BaseEstimator).
            show_bases: true
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            # Group by category — pulls Attributes, Parameters, etc.
            # out of NumPy-style docstrings into proper sections.
            docstring_style: numpy
            docstring_section_style: table
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            # Keep generated pages tidy — don't render every private
            # `_attr` or special method by default.
            filters:
              - "!^_"
              - "^__init__$"
            inherited_members: false

nav:
  - Home: index.md
  - Installation: installation.md
  - Quick start: quickstart.md
  - Concepts:
      - concepts/index.md
      - Penalties: concepts/penalties.md
      - Datafits: concepts/datafits.md
      - Weights: concepts/weights.md
      - Backends: concepts/backends.md
  - Porting from R:
      - From glmnet: porting/glmnet.md
      - From ncvreg: porting/ncvreg.md
      - From grpreg: porting/grpreg.md
  - Extending:
      - Custom penalties: extending/penalty.md
      - Custom datafits: extending/datafit.md
      - Custom backends: extending/backend.md
  - Examples:
      - Genomics (sparse-group MCP): examples/genomics.md
      - NLP (sparse logistic): examples/nlp.md
      - Survival (Cox sparse-group MCP): examples/survival.md
  - API reference:
      - api/index.md
      - LS estimators: api/estimators-ls.md
      - Logistic estimators: api/estimators-logistic.md
      - Poisson estimators: api/estimators-poisson.md
      - Cox estimators: api/estimators-cox.md
      - Cross-validation: api/cv.md
      - IC selection: api/ic.md
      - Design helpers: api/design.md
      - Extension ABCs: api/abcs.md
  - Roadmap: roadmap.md
