site_name: skein
site_description: Weighted structured nonconvex sparse models — Rust core, Python API
site_url: https://dvillacis.github.io/skein/
repo_name: dvillacis/skein
repo_url: https://github.com/dvillacis/skein
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tilde

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# Plugin section is intentionally minimal in commit 1. The mkdocstrings
# plugin (for auto API reference from Python docstrings) is added in
# the M8 follow-up commit; the search plugin is enabled by default in
# mkdocs so it doesn't need an explicit entry.

nav:
  - Home: index.md
  - Installation: installation.md
  - Quick start: quickstart.md
  - Concepts:
      - concepts/index.md
      - Penalties: concepts/penalties.md
      - Datafits: concepts/datafits.md
      - Weights: concepts/weights.md
      - Backends: concepts/backends.md
  - Roadmap: roadmap.md
