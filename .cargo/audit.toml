# cargo-audit configuration for the `security` CI job.
# Format: https://docs.rs/cargo-audit/latest/cargo_audit/config/index.html
#
# Documented allowlist. Every entry below names an advisory we have
# evaluated and concluded does not affect skein in its shipped form.
# An advisory should only stay here while that conclusion holds; when
# the rationale changes (upstream fix becomes cheap, or our usage
# starts to overlap the vulnerable API), remove the entry and update
# the dependency instead.

[advisories]
ignore = [
    # RUSTSEC-2025-0020 — pyo3 0.22.6: buffer overflow risk in
    # `PyString::from_object`. Fix is pyo3 >= 0.24.1. We do not call
    # `PyString::from_object` anywhere in `crates/skein-py`
    # (grep -rn "PyString" crates/ python/ → 0 hits); the vulnerable
    # API is unreachable from our binding surface. The 0.22 → 0.24
    # bump is a deliberate breaking refactor (Bound<'py, T> default
    # API + corresponding numpy crate bump) that earns its own
    # milestone, not a security-driven emergency. Re-evaluate this
    # ignore when that bump is scheduled.
    "RUSTSEC-2025-0020",
]
