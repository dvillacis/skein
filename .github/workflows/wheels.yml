name: Wheels

# Builds wheels via cibuildwheel for Linux (manylinux + musllinux on
# x86_64 and aarch64), macOS arm64, and Windows AMD64; uploads them
# as workflow artifacts; and (on tag push) publishes to PyPI via
# Trusted Publishers (no API token / no long-lived secret).
#
# One-time PyPI setup before the first publish works:
#
#   1. The "pending" trusted-publisher flow below reserves the
#      PyPI project name `skein-glm` on first publish, so no
#      separate "create project" step is needed.
#   2. Go to https://pypi.org/manage/account/publishing/ →
#      "Add a new pending publisher" → fill in:
#        PyPI project name: skein-glm
#        Owner:             dvillacis
#        Repository name:   skein
#        Workflow filename: wheels.yml
#        Environment name:  pypi   (optional but recommended)
#   3. On the GitHub side, create the `pypi` environment in
#      Settings → Environments. Add reviewers / branch protection
#      rules if you want a manual-approval gate before publishes.
#
# After that, every `git tag v* && git push origin v*` triggers
# wheel builds, sdist build, and (gated by `if:`) the publish job.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build_wheels:
    name: ${{ matrix.os }} ${{ matrix.cibw_archs }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cibw_archs: x86_64
          - os: ubuntu-latest
            cibw_archs: aarch64
          - os: macos-14
            cibw_archs: arm64
          - os: windows-latest
            cibw_archs: AMD64
          # Linux x86_64 covers manylinux2014/_2_28 + musllinux_1_2 in one
          # matrix entry. Linux aarch64 builds the same two libc flavors
          # via QEMU emulation (`docker/setup-qemu-action` step below);
          # cibuildwheel registers the binfmt_misc handlers and runs the
          # manylinux/musllinux aarch64 containers transparently. The
          # aarch64 build is ~40 min wall on cold cache, well under the
          # 6h GH Actions runner cap, but it does gate the publish job —
          # if the cibuildwheel ecosystem regresses around aarch64
          # emulation, the v0.1.x trade-off (build only x86_64, sdist
          # fallback for aarch64 users) is the documented fallback.
          # macOS Intel (macos-13 x86_64) stays dropped — Apple Silicon
          # is the macOS canon and Rosetta covers Intel users from the
          # arm64 wheel for development, sdist for production.
    steps:
      - uses: actions/checkout@v6

      # binfmt_misc handlers for non-native arches. Only needed when
      # the runner arch (x86_64) differs from the wheel arch (aarch64);
      # cibuildwheel picks up the registered handler automatically and
      # transparently runs the manylinux/musllinux aarch64 containers
      # under QEMU. No-op when building x86_64 / arm64 / AMD64 natively.
      - name: Set up QEMU
        if: matrix.cibw_archs == 'aarch64'
        uses: docker/setup-qemu-action@v3

      - uses: pypa/cibuildwheel@v2.21
        env:
          # ABI3 wheels: one wheel per platform covers cp310+.
          CIBW_BUILD: "cp310-*"
          CIBW_ARCHS: ${{ matrix.cibw_archs }}

          # ---- BLAS dispatch on the inner CD's hot path -----------
          #
          # ndarray's pure-Rust `dot_generic` (the no-BLAS fallback)
          # is ~3× slower than hardware BLAS on the M10.1 profile.
          # cibuildwheel sets `MATURIN_PEP517_ARGS` per-platform so
          # the wheel built for each OS routes through the right
          # BLAS provider:
          #
          #   macOS:    `--features=blas-accelerate`  (Apple
          #             Accelerate, ships with the OS — zero
          #             install).
          #   Linux:    `--features=blas-openblas`    (system
          #             OpenBLAS via `openblas-devel` on
          #             RHEL/Debian, `openblas-dev` on Alpine,
          #             installed in the manylinux / musllinux
          #             container by `CIBW_BEFORE_ALL_LINUX`
          #             below). `auditwheel` then bundles
          #             `libopenblas.so.*` into the wheel so the
          #             installed package is self-contained.
          #             Applies to manylinux + musllinux on both
          #             x86_64 and aarch64.
          #   Windows:  no BLAS feature for now — easy
          #             cross-platform OpenBLAS distribution on
          #             Windows is its own project. Wheel still
          #             works (uses `dot_generic`), just slower.
          CIBW_ENVIRONMENT_MACOS: 'MATURIN_PEP517_ARGS="--features=blas-accelerate"'
          CIBW_ENVIRONMENT_LINUX: |
            PATH="$HOME/.cargo/bin:$PATH"
            MATURIN_PEP517_ARGS="--features=blas-openblas"
            PKG_CONFIG_PATH="/usr/lib64/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/lib/pkgconfig"

          # Rust toolchain + OpenBLAS inside the wheel build container.
          # `openblas-devel` provides `libopenblas.so` + the CBLAS
          # headers `openblas-src` looks up via pkg-config. Package
          # manager dispatch covers every container cibuildwheel ships:
          #   * yum            — manylinux2014 (CentOS 7)
          #   * dnf            — manylinux_2_28 (AlmaLinux 8 / 9)
          #   * apt-get        — Debian-based variants (rare)
          #   * apk            — musllinux_1_2 (Alpine)
          CIBW_BEFORE_ALL_LINUX: |
            curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            (yum install -y openblas-devel pkgconfig 2>/dev/null) \
              || (dnf install -y openblas-devel pkgconf-pkg-config) \
              || (apt-get update && apt-get install -y libopenblas-dev pkg-config) \
              || (apk add --no-cache openblas-dev pkgconf)

          # Smoke-test the wheel post-build.
          CIBW_TEST_REQUIRES: "pytest numpy scipy scikit-learn"
          CIBW_TEST_COMMAND: "pytest {project}/tests"
          # Skip tests under QEMU emulation (slow, redundant given we
          # run the full suite on native x86_64). Also skip musllinux —
          # scipy/sklearn musl wheels exist on PyPI but the install path
          # is fragile under emulation and the build smoke alone is
          # enough to catch a broken wheel.
          CIBW_TEST_SKIP: "*-linux_aarch64 *-musllinux_*"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.cibw_archs }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    # Only publish on tag pushes — workflow_dispatch runs from main
    # build wheels but stop short of publishing, so you can dry-run
    # the wheel build without releasing anything.
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      # Required for OIDC / Trusted Publishers. No PyPI token needed.
      id-token: write
    steps:
      - name: Download wheel + sdist artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        # No `password:` field — pypa/gh-action-pypi-publish auto-
        # detects the OIDC token from `id-token: write` and uses it
        # against the configured Trusted Publisher on PyPI.
        #
        # `skip-existing: true` makes a partial-publish-then-retry
        # safe: PyPI files are immutable (`file already exists` is a
        # hard 400), so if any file in the dist set has already been
        # uploaded by a previous run we silently skip it rather than
        # failing the whole job. Useful when, e.g., the wheels
        # uploaded successfully but the sdist failed metadata
        # validation, requiring a retry of just the sdist.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
