name: Wheels

# Builds wheels via cibuildwheel for Linux x86_64/aarch64, macOS
# arm64+x86_64, and Windows x86_64. Triggered on tag push (v*) and
# manual dispatch. Wheels land as workflow artifacts.
#
# To publish to PyPI on tag, set the `PYPI_API_TOKEN` repository
# secret and uncomment the publish job below.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build_wheels:
    name: ${{ matrix.os }} ${{ matrix.cibw_archs }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cibw_archs: x86_64
          - os: ubuntu-latest
            cibw_archs: aarch64
          - os: macos-13
            cibw_archs: x86_64
          - os: macos-14
            cibw_archs: arm64
          - os: windows-latest
            cibw_archs: AMD64
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (Linux aarch64 only)
        if: matrix.os == 'ubuntu-latest' && matrix.cibw_archs == 'aarch64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: pypa/cibuildwheel@v2.21
        env:
          # ABI3 wheels: one wheel per platform covers cp310+.
          CIBW_BUILD: "cp310-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS: ${{ matrix.cibw_archs }}
          # Rust toolchain inside the manylinux container.
          CIBW_BEFORE_ALL_LINUX: "curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable"
          CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH"'
          # Smoke-test the wheel post-build.
          CIBW_TEST_REQUIRES: "pytest numpy scipy scikit-learn"
          CIBW_TEST_COMMAND: "pytest {project}/tests"
          # Skip aarch64 tests under emulation (slow, redundant given we
          # run the full suite on x86_64).
          CIBW_TEST_SKIP: "*-linux_aarch64"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.cibw_archs }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # Uncomment to publish on tag once `PYPI_API_TOKEN` is set as a
  # repository secret.
  #
