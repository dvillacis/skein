name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: solver pre-flight (tight-tol screening)
        # CLAUDE.md mandates running this single test in isolation before
        # the full suite after any convergence-logic change. Reason: the
        # test pins cd.tol = 1e-12; if a future change makes a stopping
        # condition unreachable (e.g. `gap < tol²` → 1e-24), the test
        # loops forever instead of failing. Cargo runs the lib suite in
        # parallel, so one runaway test starves every core and the whole
        # `cargo test` step hangs until the job timeout.
        #
        # Running it as its own short step with `timeout-minutes` fails
        # fast and points at the right culprit, rather than blocking on
        # the full suite for hours with no signal. Healthy run takes
        # well under a second; 2 min is generous.
        timeout-minutes: 2
        run: cargo test -p skein-core --lib solve_path_screening_on_matches_screening_off_within_tol -- --nocapture
      - name: cargo test
        run: cargo test -p skein-core --lib

  python:
    name: python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: pin PATH (setup-python first; cargo present)
        # On macos-latest GitHub runners as of 2026-05, the preinstalled
        # framework Python at `/Library/Frameworks/Python.framework/...`
        # appears on PATH ahead of `actions/setup-python`'s install,
        # so a bare `python -m pip install` lands in the framework
        # interpreter and pip's maturin subprocess doesn't see
        # `~/.cargo/bin` (different process tree). Both pushes are
        # idempotent and harmless on Linux runners.
        run: |
          echo "$pythonLocation/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: install package + dev deps
        # `pip install -e ".[dev]"` triggers maturin via the
        # pyproject build-system, which works without an active
        # virtualenv (unlike bare `maturin develop --release`, which
        # refuses to install into the runner's system Python).
        #
        # MATURIN_PEP517_ARGS forces dev-profile compilation. Maturin's
        # PEP 517 default is release, which on the 2-core GitHub runners
        # turns the cold-cache build into a >40-minute affair (LTO + the
        # full criterion / ndarray / pyo3 transitive set). Dev profile
        # cuts that to ~3-4 min; tests run plenty fast in dev mode.
        #
        # `pip -v` streams the cargo build output so progress is
        # visible instead of an opaque "still running..." heartbeat.
        env:
          MATURIN_PEP517_ARGS: "--profile dev"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -v -e ".[dev]"
      - name: import smoke
        # Fail fast on runtime PyO3 symbol drift — a renamed Rust
        # `solve_*_path` export or an arg-count mismatch compiles
        # green (clippy --workspace covers the Rust side) and would
        # only surface in the slow pytest step. Importing the package
        # exercises every binding the Python facade dispatches to;
        # if any expected symbol is missing the failure is loud and
        # immediate.
        run: |
          python - <<'PY'
          import skein_glm
          # touch the dispatch surface — the facade imports at module
          # load time pull in every solver-binding indirectly.
          for name in ("MCPRegressor", "SCADRegressor",
                      "GroupLassoRegressor", "GroupMCPRegressor",
                      "LogisticLassoRegressor", "PoissonLassoRegressor"):
              assert hasattr(skein_glm, name), f"missing symbol: {name}"
          print("skein_glm import smoke OK")
          PY
      - name: ruff
        run: ruff check python/ tests/
      - name: mypy
        run: mypy python/
      - name: pytest
        # SKEIN_REQUIRE_FIXTURES=1 turns the R-regression test soft-skips
        # into hard failures so an accidental deletion of
        # tests/fixtures/*.json (which are checked into git) is caught
        # in CI instead of masquerading as a green run.
        env:
          SKEIN_REQUIRE_FIXTURES: "1"
        run: pytest

  docs:
    name: docs build (sphinx -W)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pin PATH (setup-python first; cargo present)
        # See the python-job step of the same name for the rationale.
        run: |
          echo "$pythonLocation/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: install package + docs deps
        # autodoc imports the package to introspect docstrings, so
        # the Rust extension has to be built (maturin via pyproject
        # build-system). Dev-profile compile keeps CI fast.
        env:
          MATURIN_PEP517_ARGS: "--profile dev"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -v -e ".[docs]"
      - name: sphinx-build (warnings as errors)
        # `-W` turns any warning (broken cross-ref, missing autodoc
        # target, MyST parse error, etc.) into a fatal error so we
        # catch breakage before it hits the published site.
        run: sphinx-build -W -b html docs docs/_build/html
