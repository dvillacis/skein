# ReadTheDocs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# Hosts the mkdocs-material site published locally via `mkdocs serve`.
# Builds the Rust extension during `pip install` so mkdocstrings can
# import `skein` and introspect Python class docstrings.

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
    # RTD provisions a stable Rust toolchain when this key is set;
    # `pip install .[docs]` below then uses maturin (via the
    # pyproject build-system) to compile the Rust extension during
    # the install step. Without this, `from skein_glm._core import …` in
    # `python/skein_glm/__init__.py` would fail at docs-build time and
    # mkdocstrings couldn't introspect any class.
    #
    # Need Rust ≥ 1.85 so cargo can parse manifests with Cargo's
    # `edition2024` feature, which `wit-bindgen-core 0.51.0` (pulled
    # transitively via criterion's wasm-benchmarking deps) requires.
    rust: "1.86"

sphinx:
  configuration: docs/conf.py
  # `-W`-equivalent: a warning during build (broken cross-ref,
  # missing autodoc target, etc.) fails the build instead of
  # producing a half-broken site.
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
