# ReadTheDocs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# Hosts the mkdocs-material site published locally via `mkdocs serve`.
# Builds the Rust extension during `pip install` so mkdocstrings can
# import `skein` and introspect Python class docstrings.

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
    # RTD provisions a stable Rust toolchain when this key is set;
    # `pip install .[docs]` below then uses maturin (via the
    # pyproject build-system) to compile the Rust extension during
    # the install step. Without this, `from skein._core import …` in
    # `python/skein/__init__.py` would fail at docs-build time and
    # mkdocstrings couldn't introspect any class.
    rust: "1.82"

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
