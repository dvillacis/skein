[package]
name = "skein-py"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Python bindings for skein-core"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
skein-core = { path = "../skein-core" }
ndarray = { workspace = true }
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310"] }
numpy = "0.22"

[features]
default = []
# Forwards to `skein-core/blas-*`. Build the Python wheel with the
# feature that matches the build platform's BLAS provider:
#   macOS:    maturin develop --release --features blas-accelerate
#   Linux:    maturin develop --release --features blas-openblas
# (cibuildwheel sets these per-platform via MATURIN_PEP517_ARGS in
# .github/workflows/wheels.yml; default build keeps the no-BLAS
# fallback path so source-installs from PyPI still compile without
# system BLAS.)
blas-accelerate = ["skein-core/blas-accelerate"]
blas-openblas = ["skein-core/blas-openblas"]
