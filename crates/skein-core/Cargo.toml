[package]
name = "skein-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Core algorithms for weighted structured nonconvex sparse models"

[dependencies]
ndarray = { workspace = true }
rayon = { workspace = true }
num-traits = { workspace = true }
thiserror = { workspace = true }
memmap2 = "0.9"
blas-src = { version = "0.11", default-features = false, optional = true }
accelerate-src = { version = "0.3", optional = true }

[features]
default = []
# Route ndarray's `dot` / `scaled_add` / `gemv` through hardware BLAS on
# macOS via Apple's Accelerate framework (ships with the OS, zero install
# cost). On the medium lasso/LS bench this is roughly a 3× speedup on
# `col_dot` per the M10.1 profile. For Linux / Windows, add a sibling
# feature that selects a different `blas-src` provider (e.g. openblas).
blas-accelerate = ["ndarray/blas", "blas-src/accelerate", "dep:accelerate-src"]

[dev-dependencies]
approx = "0.5"
criterion = { version = "0.5", default-features = false, features = ["plotters", "cargo_bench_support"] }
tempfile = "3"

[[bench]]
name = "block_cd"
harness = false
