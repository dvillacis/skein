[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "skein"
version = "0.1.0"
description = "Weighted structured nonconvex sparse models (Python + Rust)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "David Villacis", email = "david@villacis.net" }]
requires-python = ">=3.10"
keywords = ["sparse", "nonconvex", "mcp", "scad", "group-lasso", "regression"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
    "maturin>=1.5",
    "ruff",
    "mypy",
]

[project.urls]
Repository = "https://github.com/dvillacis/skein"

[tool.maturin]
manifest-path = "crates/skein-py/Cargo.toml"
module-name = "skein._core"
python-source = "python"
features = ["pyo3/extension-module"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
