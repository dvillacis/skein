[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "skein-glm"
version = "0.10.0"
description = "Weighted structured nonconvex sparse models (Python + Rust)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "David Villacis", email = "david@villacis.net" }]
requires-python = ">=3.10"
keywords = ["sparse", "nonconvex", "mcp", "scad", "group-lasso", "regression"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
    "maturin>=1.5",
    "ruff",
    "mypy",
]
docs = [
    "sphinx>=7.4",
    "furo>=2024.5",
    "myst-parser>=4",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.6",
]
bench = [
    # publication-quality benchmark suite — see benches/v2/README.md
    "snakemake>=8",
    "pyarrow>=15",       # feather IPC transport for R comparators
    "pyyaml>=6",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    # comparator packages
    "skglm>=0.3",
    "celer>=0.7",
    "statsmodels>=0.14",
    "lifelines>=0.27",
]

[project.urls]
Repository = "https://github.com/dvillacis/skein"

[tool.maturin]
manifest-path = "crates/skein-py/Cargo.toml"
module-name = "skein_glm._core"
python-source = "python"
features = ["pyo3/extension-module"]
# Maturin auto-emits `License-File: LICENSE` into PKG-INFO but
# doesn't include LICENSE in the sdist tarball by default. PyPI
# 2.4 strict-validates that every License-File entry physically
# exists in the distribution and rejects mismatches. Explicit
# include patches both wheel and sdist to actually contain the
# file.
include = ["LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E702 (multi-statement-on-one-line-via-semicolon) is allowed: the
# `x_arr = common.pop("_x"); y_arr = common.pop("_y")` pattern in GLM
# dispatch is deliberately compact; splitting adds noise without
# readability gain.
ignore = ["E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "joblib", "joblib.*"]
ignore_missing_imports = true
